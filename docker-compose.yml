services:
  backend:
    build:
      context: backend
      dockerfile : Dockerfile
    container_name: classlog-backend
    ports:
      - 8081:8081
    env_file:
      - backend/.env
    depends_on:
#        mysql:
#          condition: service_healthy
        redis:
          condition: service_healthy
        ai:
          condition: service_started
    networks:
      - classlog-network
    restart: unless-stopped

#  mysql:
#    image: mysql
#    container_name: classlog-mysql
#    environment:
#      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
#      MYSQL_DATABASE: ${DB_NAME}
#    volumes:
#      - ./mysql_data:/var/lib/mysql
#    ports:
#      - 3306:3306
#    healthcheck:
#      test: [ "CMD", "mysqladmin", "ping" ]
#      interval: 5s
#      retries: 10

  redis:
    image: redis
    container_name: classlog-redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 10
    networks:
      - classlog-network
    restart: unless-stopped


  ai:
    image: classlog/ai:v3.4
    container_name: classlog-ai
    ports:
      - 8000:8000
    networks:
      - classlog-network
    env_file:
      - backend/.env

  frontend:
    build:
      context: frontend
      dockerfile : Dockerfile
    container_name: classlog-frontend
    ports:
      - 3000:3000
    depends_on:
      - backend
    env_file:
      - frontend/.env
    networks:
      - classlog-network
    restart: unless-stopped

networks:
  classlog-network:
    driver: bridge