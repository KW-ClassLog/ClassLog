services:
  backend:
    image: classlog-backend
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: classlog-backend
    ports:
      - 8081:8081
    env_file:
      - backend/.env
    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    networks:
      - classlog-network
    restart: unless-stopped

  redis:
    image: redis
    container_name: classlog-redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 10
    networks:
      - classlog-network
    restart: unless-stopped


  ai:
    image: classlog/ai:v4.1
    container_name: classlog-ai
    ports:
      - 8000:8000
    networks:
      - classlog-network
    env_file:
      - backend/.env
    restart: unless-stopped

networks:
  classlog-network:
    driver: bridge